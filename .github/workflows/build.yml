name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libpipewire-0.3-dev libspa-0.2-dev libdbus-1-dev libxcb1-dev libxcb-randr0-dev \
            libwayland-dev libgbm-dev libegl1-mesa-dev clang
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cargo test --lib
        working-directory: src-tauri

  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # On a v* tag, attach the installer to a draft release.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && 'Daytrace __VERSION__' || '' }}
          releaseDraft: true
      - uses: actions/upload-artifact@v4
        with:
          name: daytrace-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/daytrace.exe
      # The MCP server (daytrace-mcp.exe) as its own artifact, next to the installer.
      - uses: actions/upload-artifact@v4
        with:
          name: daytrace-mcp-windows
          path: src-tauri/target/release/daytrace-mcp.exe
          if-no-files-found: error

[package]
name = "daytrace"
version = "0.2.1"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "daytrace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-dialog = "2.8.3"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
xcap = { version = "0.9.8", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "sync"] }
base64 = "0.23.1"
chrono = "0.4.45"
anyhow = "1.0.104"
log = "0.4.34"
env_logger = "0.11.11"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-perl"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind" # the analysis loop recovers from panics
strip = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_StationsAndDesktops", "Win32_Graphics_Gdi", "Win32_Security_Credentials", "Win32_Graphics_Dwm", "Win32_System_Power"] }

[dev-dependencies]
tempfile = "3.27.0"

# Smaller debug builds (the dev container has limited disk).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
